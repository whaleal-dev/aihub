# GitHub Pages 发布：结构与官方 starter 相同（permissions / concurrency / deploy-pages），
# 但构建的是 docs-site 的 Docusaurus，不是仓库根目录 Jekyll。
# 不要再添加 jekyll-gh-pages.yml：它会把 README.md 当成站点首页。
name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Typecheck docs
        run: npm run typecheck

      - name: Build docs
        env:
          GITHUB_PAGES: 'true'
          DOCS_SITE_URL: https://whaleal.com
          DOCS_SITE_BASE_URL: /aihub/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
